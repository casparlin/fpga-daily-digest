name: Weekly Digest (Personal API)

on:
  schedule:
    # 周日 18:00 UTC = 北京时间周一 02:00
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v1

      - name: Check personal API config
        env:
          OPENAI_API_BASE: ${{ vars.LLM_API_BASE }}
          OPENAI_MODEL: ${{ vars.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_BASE" ] || [ -z "$OPENAI_MODEL" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "缺少配置。请在仓库 Settings 里设置："
            echo "  Variables: LLM_API_BASE, LLM_MODEL"
            echo "  Secrets:   LLM_API_KEY"
            exit 1
          fi
          echo "Using personal API: $OPENAI_API_BASE"
          echo "Model: $OPENAI_MODEL"

      - name: Generate Digest via Bun
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_BASE: ${{ vars.LLM_API_BASE }}
          OPENAI_MODEL: ${{ vars.LLM_MODEL }}
          TZ: 'Asia/Shanghai'
        run: |
          mkdir -p public/archives
          TODAY=$(date +%Y%m%d)
          FILENAME="digest-${TODAY}.md"
          echo "Starting generation for $TODAY..."
          bun scripts/digest.ts --hours 96 --top-n 15 --lang zh --output "public/archives/${FILENAME}"
          test -f "public/archives/${FILENAME}"
          cp "public/archives/${FILENAME}" public/digest.md

      - name: Commit and Push changes
        env:
          TZ: 'Asia/Shanghai'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "docs: auto-generate weekly digest for $(date +%Y%m%d)" || echo "No changes to commit"
          git push
